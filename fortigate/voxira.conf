# Voxira integration for FortiGate / FortiOS 7.x.
# Replace the tenant host, API key, callflow UUID and callee before importing.
# The API key is stored in the FortiGate configuration; restrict configuration access.

config system automation-action
    edit "voxira-call"
        set description "Queue a spoken FortiGate alert through the Voxira Calls v2 API"
        set action-type webhook
        set minimum-interval 300
        set protocol https
        set method post
        set uri "voxira.example.com/api/call/v2"
        set http-body "{\"callee\":\"REPLACE_WITH_E164_NUMBER\",\"callflow\":\"REPLACE_WITH_CALLFLOW_UUID\",\"parameters\":{\"alert_text\":\"FortiGate %%log.devname%% reports %%log.logdesc%%. %%log.msg%%\",\"message\":\"%%log.msg%%\",\"source\":\"fortigate\",\"event\":\"%%log.logdesc%%\",\"device\":\"%%log.devname%%\",\"log_id\":\"%%log.logid%%\"}}"
        set port 443
        set verify-host-cert enable
        config http-headers
            edit 1
                set key "Authorization"
                set value "Bearer REPLACE_WITH_VOXIRA_API_KEY"
            next
            edit 2
                set key "Content-Type"
                set value "application/json"
            next
            edit 3
                set key "Accept"
                set value "application/json"
            next
        end
    next
end

# Example trigger: failed FortiGate administrator login (log ID 32002).
config system automation-trigger
    edit "voxira-admin-login-failed"
        set description "Call through Voxira after a failed administrator login"
        set event-type event-log
        set logid 32002
    next
end

config system automation-stitch
    edit "voxira-admin-login-failed"
        set description "Send failed administrator login events to Voxira"
        set trigger "voxira-admin-login-failed"
        config actions
            edit 1
                set action "voxira-call"
                set required enable
            next
        end
    next
end
