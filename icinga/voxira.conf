// Install the script and credentials on every node that executes notifications.
template NotificationCommand "voxira-base" {
  command = [ "/usr/bin/python3", "/etc/icinga2/scripts/voxira-notification.py" ]
  timeout = 30s
  arguments = {
    "--config" = "/etc/icinga2/voxira.json"
  }
  env = {
    VOXIRA_TO = "$user.vars.voxira_phone$"
    VOXIRA_TYPE = "$notification.type$"
    VOXIRA_HOST = "$host.display_name$"
  }
}

object NotificationCommand "voxira-host-notification" {
  import "voxira-base"
  env += {
    VOXIRA_STATE = "$host.state$"
    VOXIRA_OUTPUT = "$host.output$"
  }
}

object NotificationCommand "voxira-service-notification" {
  import "voxira-base"
  env += {
    VOXIRA_SERVICE = "$service.display_name$"
    VOXIRA_STATE = "$service.state$"
    VOXIRA_OUTPUT = "$service.output$"
  }
}

// Replace the example number before opting any objects in.
object User "voxira-oncall" {
  display_name = "Voxira on-call"
  enable_notifications = true
  vars.voxira_phone = "+31612345678"
}

apply Notification "voxira-host" to Host {
  command = "voxira-host-notification"
  users = [ "voxira-oncall" ]
  interval = 0 // No periodic repeat calls.
  types = [ Problem, Recovery, Custom ]
  states = [ Up, Down ]
  assign where host.vars.voxira_notifications == true
}

apply Notification "voxira-service" to Service {
  command = "voxira-service-notification"
  users = [ "voxira-oncall" ]
  interval = 0
  types = [ Problem, Recovery, Custom ]
  states = [ OK, Warning, Critical, Unknown ]
  assign where service.vars.voxira_notifications == true
}
