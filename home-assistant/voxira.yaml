# Include this file as a Home Assistant package. Store every value in secrets.yaml.
rest_command:
  voxira_call:
    url: !secret voxira_api_url
    method: POST
    headers:
      authorization: !secret voxira_authorization
      accept: "application/json"
    content_type: "application/json; charset=utf-8"
    verify_ssl: true
    timeout: 20
    payload: >-
      {{ {
        "callee": to,
        "callflow": callflow,
        "calldate": now().isoformat(),
        "parameters": {
          "message": message,
          "alert_text": message,
          "source": "home_assistant"
        }
      } | to_json }}

script:
  voxira_call:
    alias: Voxira phone call
    description: Queue a spoken Voxira notification
    mode: queued
    max: 10
    fields:
      message:
        name: Message
        required: true
        selector:
          text:
            multiline: true
      to:
        name: Telephone number
        required: true
        selector:
          text:
      callflow:
        name: Voxira callflow UUID
        required: true
        selector:
          text:
    sequence:
      - action: rest_command.voxira_call
        data:
          message: "{{ message }}"
          to: "{{ to }}"
          callflow: "{{ callflow }}"
        response_variable: voxira_response
      - if:
          - condition: template
            value_template: "{{ voxira_response.status != 201 }}"
        then:
          - stop: "Voxira rejected the call"
            error: true
